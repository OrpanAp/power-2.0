<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Admin · {{ appName }}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/presentation.css">
  {{{ liveReload }}}
</head>
<body class="admin">
  <aside class="side">
    <a class="brand" href="/admin">⚡ {{ appName }}</a>
    <nav>
      <a href="/admin" class="{{ section == 'dashboard' ? 'active' : '' }}">Dashboard</a>
      <a href="/admin/users" class="{{ section == 'users' ? 'active' : '' }}">Users</a>
      <a href="/admin/presentations" class="{{ section == 'presentations' ? 'active' : '' }}">Presentations</a>
      <a href="/admin/tables" class="{{ section == 'tables' ? 'active' : '' }}">Database</a>
      <a href="/admin/logs" class="{{ section == 'logs' ? 'active' : '' }}">System logs</a>
      <a href="/account/security">My account</a>
      <a href="/">← Public site</a>
    </nav>
    <form method="post" action="/logout">{{{ csrfField }}}<button class="link">Sign out</button></form>
  </aside>
  <main class="content">
    <h1>{{ title }}</h1>
    <include type="html" path="partials/flash">
    <% block content %><% endblock %>
  </main>
  <script src="/js/app.js" defer></script>
  <script src="/js/admin.js" defer></script>
</body>
</html>
